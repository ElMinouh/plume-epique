name: Tests automatisés

# Rôle : "npm test" (suite Vitest, ~300 tests) est lancé automatiquement.
# Ce workflow le relance automatiquement à chaque push et à chaque pull
# request sur main — une régression est détectée avant même de s'en
# apercevoir, sans rien changer à la façon dont les tests sont écrits.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# v9.69.0 (audit AUD-06-020) — DROITS MINIMAUX du jeton GitHub de ce workflow : lecture du dépôt seulement. Ce workflow n'a
# aucun besoin d'écrire (ni commit, ni release, ni commentaire) : un maillon compromis ne peut donc rien modifier par lui.
permissions:
  contents: read

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Installer les dépendances
        run: npm ci
      - name: Lancer les tests
        run: npm test
      # v9.84.1 (audit AUD-09-001) — parcours dans un vrai navigateur (Chromium) : la suite Vitest tourne sous Node et ne voit
      # ni l'affichage ni les fenêtres ; la v9.84.0 a été publiée page figée avec tous les tests verts.
      - name: Installer Chromium (parcours navigateur)
        run: npx playwright install --with-deps chromium
      - name: Parcours navigateur (npm run e2e)
        run: npm run e2e
      # v9.69.0 (audit AUD-06-020) — le contrôle est BLOQUANT au niveau « élevé » (aucune alerte élevée aujourd'hui :
      # seules 3 alertes modérées de l'outil en ligne de commande de mammoth, absent du site). Un niveau « modéré » sans
      # correctif ne doit pas empêcher de livrer ; un niveau « élevé » ou « critique » oui.
      - name: Audit de sécurité des dépendances de production (bloquant, niveau élevé et critique)
        run: npm audit --omit=dev --audit-level=high
      # Signatures et provenance des paquets installés (le registre npm signe chaque version publiée).
      - name: Signatures des paquets npm
        run: npm audit signatures
      # Intégrité de vendor/ : empreintes enregistrées (SHA256SUMS) ET comparaison aux paquets officiels (node_modules).
      - name: Intégrité des bibliothèques de vendor/
        run: |
          node scripts/vendor-empreintes.cjs
          node scripts/vendor-compare-npm.cjs
