name: Déployer les Workers Cloudflare

# Rôle : jusqu'ici, toute modification de worker/sync-worker.js ou
# worker/worker.js exigeait un copier-coller manuel dans le dashboard
# Cloudflare ("Quick Edit") — avec le risque, déjà identifié, que le
# fichier de référence du dépôt et le code réellement déployé finissent
# par diverger sans que personne ne s'en aperçoive. Ce workflow supprime
# ce risque : il déploie automatiquement le code du dépôt dès qu'il change.
#
# Se déclenche sur push vers main touchant l'un des deux Workers ou leur
# config, ou manuellement via l'onglet "Actions" du dépôt GitHub (bouton
# "Run workflow", utile pour un premier essai sans attendre un vrai push).
#
# Les deux jobs se redéploient TOUS LES DEUX dès qu'un seul fichier change
# (plus simple et plus sûr qu'un déclenchement fin par fichier) : un
# redéploiement d'un Worker dont le code n'a pas changé est sans effet,
# le coût est négligeable.
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  workflow_dispatch:

jobs:
  # v9.29.0 (audit AUD-01-015) — plus aucun déploiement si les tests échouent : le Worker de synchro est
  # le point le plus sensible du projet (incident du 27/07/2026), il ne part en production qu'après
  # une suite verte. Les deux déploiements ci-dessous dépendent de ce job.
  tests:
    name: Tests avant déploiement
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Installer Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  deploy-sync-worker:
    needs: tests
    name: Déployer plume-epique-sync
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Contrôle à blanc (configuration et liaisons)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'worker'
          command: deploy sync-worker.js --config wrangler-sync.toml --dry-run
      - name: Déployer sur Cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'worker'
          command: deploy sync-worker.js --config wrangler-sync.toml

  deploy-ai-worker:
    needs: tests
    name: Déployer plume-epique-ai
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Contrôle à blanc (configuration et liaisons)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'worker'
          command: deploy worker.js --config wrangler-ai.toml --dry-run
      - name: Déployer sur Cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'worker'
          command: deploy worker.js --config wrangler-ai.toml
