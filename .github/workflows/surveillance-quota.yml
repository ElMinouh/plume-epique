name: Surveillance du quota D1

# v9.70.0 (audit AUD-07-008) — Les limites gratuites de D1 (100 000 lignes écrites et 5 millions lues par jour) sont
# partagées par toutes les bases du compte. Ce contrôle quotidien additionne les 24 dernières heures de chaque base et
# ÉCHOUE à partir de 80 % d'une limite : GitHub envoie alors un courriel d'échec de workflow. Ne lit aucun contenu.
# Rappel : GitHub suspend les workflows planifiés après 60 jours sans activité sur le dépôt.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quota:
    name: Quota D1 du compte
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Installer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Mesurer la consommation des dernières 24 h
        run: node scripts/surveiller-quota-d1.cjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
