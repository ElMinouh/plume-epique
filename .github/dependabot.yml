# Alerte et propose automatiquement une mise à jour (pull request) si une
# faille de sécurité est découverte dans une dépendance — vitest, jsdom
# (npm), ou les actions utilisées par les workflows (actions/checkout,
# cloudflare/wrangler-action...). Gratuit, ne modifie jamais rien tout
# seul : ça ouvre juste une pull request à examiner et fusionner soi-même.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # v9.1.x — jsdom 30.0.0 embarque une version d'"undici" cassée
      # (TypeError: webidl.util.markAsUncloneable is not a function),
      # qui fait échouer les 143 tests sans rapport avec le code de
      # l'app elle-même (voir pull request #4, fermée sans fusion).
      # Seules les mises à jour MAJEURES de jsdom sont ignorées ici ;
      # les correctifs mineurs/patchs (ex. 29.1.x → 29.1.y) continuent
      # d'être proposés normalement. À retirer une fois jsdom 30.x
      # stabilisé.
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
