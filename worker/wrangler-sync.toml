# Configuration de déploiement pour le Worker "plume-epique-sync".
# Utilisée par .github/workflows/deploy-workers.yml (Wrangler, l'outil
# officiel de déploiement Cloudflare) — plus besoin de copier-coller dans
# le dashboard.

name = "plume-epique-sync"
main = "sync-worker.js"
compatibility_date = "2026-07-28"

# v9.63.3 (audit AUD-06-013) — le namespace KV « plume-sync » n'est plus lié : il ne sert plus qu'à
# l'archive (vidé par scripts/migrer-kv-vers-d1.cjs --vider-kv, puis supprimable depuis le dashboard).

# Les secrets (SYNC_KEY) ne se déclarent JAMAIS ici (ce fichier est dans le
# dépôt Git) : ils restent tels que déjà configurés dans le dashboard
# Cloudflare (Worker → Variables and Secrets), et un déploiement Wrangler
# ne les touche pas.

# v9.23.0 — Stockage D1 (remplace KV ; plus aucun repli sur KV depuis la v9.63.3). Le nom du binding ("DB") est fige dans le code.
# L identifiant n est pas un secret.
[[d1_databases]]
binding = "DB"
database_name = "plume-sync"
database_id = "f6c1beed-fcc1-4bed-9a59-e06d603a0e93"

# v9.29.0 (audit AUD-01-016) - journaux Cloudflare (Workers Logs) : une ligne JSON par requete, sans
# aucun contenu de texte (voir logEvent dans le Worker). Consultation : dashboard > Workers > Logs.
[observability]
enabled = true
