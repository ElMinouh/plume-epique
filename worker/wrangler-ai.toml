# Configuration de déploiement pour le Worker "plume-epique-ai".
# Utilisée par .github/workflows/deploy-workers.yml (Wrangler, l'outil
# officiel de déploiement Cloudflare) — plus besoin de copier-coller dans
# le dashboard.

name = "plume-epique-ai"
main = "worker.js"
compatibility_date = "2026-07-28"

# Pas de namespace KV pour ce Worker. Deux secrets, à configurer dans le
# dashboard Cloudflare (Worker → Variables and Secrets) ou par
# `npx wrangler secret put <NOM> -c worker/wrangler-ai.toml` :
#   - GEMINI_API_KEY : clé Google AI (fournisseur IA, depuis le 11/09/2026) ;
#   - SYNC_KEY (v9.20.0) : la MÊME valeur que celle du Worker de synchro —
#     sans elle le relais refuse tout appel (fail-closed).
# Un déploiement Wrangler ne touche pas aux secrets ; ils ne se déclarent
# jamais dans ce fichier (qui est dans le dépôt Git).

# v9.29.0 (audit AUD-01-016) - journaux Cloudflare (Workers Logs) : une ligne JSON par requete, sans
# aucun contenu de texte (voir logEvent dans le Worker). Consultation : dashboard > Workers > Logs.
[observability]
enabled = true
